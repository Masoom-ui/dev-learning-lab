# Render Blueprint — backend + Postgres
# Docs: docs/deploy.md
# After deploy: set MONGODB_URL, JWT_SECRET, CORS_ORIGINS in Render dashboard

databases:
  - name: devlab-postgres
    plan: free
    databaseName: devlab
    user: devlab

services:
  - type: web
    name: dev-learning-lab-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devlab-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: MONGODB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
